<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Agamydroid</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--a:#7c5cff;--card:#fff;--txt:#1d1b20;--sur:#f5f1fb;--mut:#6b6775}
body.dark{--card:#2b2930;--txt:#e6e1e9;--sur:#1c1b1f;--mut:#aaa5b3}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden;background:#000;color:#fff;font-family:"Google Sans Flex","Google Sans",Roboto,"Segoe UI",system-ui,sans-serif}
#dev{position:fixed;inset:0;overflow:hidden;background:var(--wall) center/cover;transition:background .6s}
#dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:99}
#sb{position:absolute;top:0;left:0;right:0;height:32px;z-index:60;display:flex;justify-content:space-between;align-items:center;padding:0 20px;font-size:13px;font-weight:500;cursor:pointer;text-shadow:0 1px 6px #0006}
#sb span{display:flex;gap:10px;align-items:center}
#home{position:absolute;inset:0;padding:0 5vw;transition:.35s}
#home.away{transform:scale(.94);opacity:.4}
#wid{position:absolute;top:15%;left:7vw}
#clk{font-size:min(16vw,120px);font-weight:300;letter-spacing:-3px;line-height:1}
#dat{font-size:20px;margin-top:8px;opacity:.9}
#dock{position:absolute;left:50%;bottom:112px;transform:translateX(-50%);display:flex;gap:18px;padding:14px 22px;background:#ffffff26;backdrop-filter:blur(24px);border-radius:36px}
#srch{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);width:min(560px,86vw);height:50px;border-radius:25px;background:#ffffffd9;color:#1d1b20;display:flex;align-items:center;padding:0 20px;gap:12px;font-size:16px;cursor:text}
.app{display:flex;flex-direction:column;align-items:center;gap:6px;width:84px;font-size:12px;cursor:pointer;text-shadow:0 1px 4px #0006}
.ic{width:58px;height:58px;border-radius:20px;display:grid;place-items:center;font-size:28px;overflow:hidden;box-shadow:0 3px 10px #0004;transition:transform .15s}
.ic img{width:100%;height:100%;object-fit:cover}
.app:active .ic{transform:scale(.9)}
#dock .app span{display:none}
#drawer{position:absolute;inset:0;z-index:30;background:#14121bd9;backdrop-filter:blur(30px);transform:translateY(100%);transition:.38s cubic-bezier(.2,.8,.2,1);padding:50px 6vw 70px;overflow:auto}
#drawer.on{transform:none}
#drawer input{width:100%;max-width:520px;display:block;margin:0 auto 28px;height:48px;border:0;border-radius:24px;padding:0 22px;font-size:16px;background:#ffffff26;color:#fff;outline:0}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:22px 6px;justify-items:center}
#shade{position:absolute;left:0;right:0;top:0;z-index:55;background:#1d1b20f2;backdrop-filter:blur(30px);transform:translateY(-105%);transition:.35s cubic-bezier(.2,.8,.2,1);padding:44px 5vw 22px;max-height:100%;overflow:auto}
#shade.on{transform:none}
#tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.tile{height:64px;border-radius:32px;background:#ffffff1f;display:flex;align-items:center;gap:8px;padding:0 16px;font-size:13px;cursor:pointer;transition:.2s}
.tile.on{background:var(--a)}
.tile i{font-style:normal;font-size:20px}
#bri{width:100%;accent-color:var(--a);margin:6px 0 16px}
.note{background:#ffffff14;border-radius:22px;padding:14px 18px;margin-top:8px;font-size:14px}
.note small{display:block;opacity:.65;margin-bottom:3px}
#lock{position:absolute;inset:0;z-index:80;background:var(--wall) center/cover;transition:.45s cubic-bezier(.2,.8,.2,1);text-align:center;padding-top:16vh;cursor:pointer}
#lock.off{transform:translateY(-100%)}
#lt{font-size:min(24vw,170px);font-weight:300;line-height:1;letter-spacing:-4px}
#ld{font-size:22px;margin-top:10px}
#lh{position:absolute;bottom:40px;left:0;right:0;font-size:14px;opacity:.85}
#wins{position:absolute;inset:0;z-index:20;pointer-events:none}
.win{position:absolute;inset:32px 0 48px;transform:scale(.8);opacity:0;pointer-events:none;transition:.3s cubic-bezier(.2,.8,.2,1);border-radius:32px;overflow:hidden;background:var(--sur);color:var(--txt);display:flex;flex-direction:column}
.win.on{transform:none;opacity:1;pointer-events:auto;border-radius:0}
.bar{padding:16px 24px;font-size:22px;font-weight:500;flex:none}
.body{flex:1;overflow:auto;padding:0 24px 24px;position:relative}
.body iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
#nav{position:absolute;bottom:0;left:0;right:0;height:48px;z-index:70;display:flex;align-items:center;justify-content:space-between;padding:0 6vw}
#nav button{width:56px;height:36px;border:0;background:none;color:#fff;font-size:18px;cursor:pointer;text-shadow:0 1px 4px #0008}
#pill{width:130px;height:6px;border-radius:3px;background:#fff;cursor:pointer;box-shadow:0 1px 4px #0008}
body.dark #nav button{color:#fff}
#rec{position:absolute;inset:32px 0 48px;z-index:40;background:#14121bd9;backdrop-filter:blur(26px);display:none;align-items:center;gap:24px;padding:0 6vw;overflow-x:auto}
#rec.on{display:flex}
.card{flex:none;width:min(240px,60vw);height:min(380px,60vh);border-radius:28px;background:var(--card);color:var(--txt);padding:16px;display:flex;flex-direction:column;cursor:pointer}
.card b{display:flex;align-items:center;gap:10px;font-weight:500}
.card .ic{width:36px;height:36px;font-size:18px;border-radius:12px;box-shadow:none}
.card p{margin-top:auto;color:var(--mut);font-size:13px}
.card button{margin-top:10px;border:0;border-radius:20px;height:36px;background:var(--sur);color:var(--txt);cursor:pointer}
#toast{position:absolute;left:50%;bottom:70px;transform:translate(-50%,20px);background:#322f35;color:#fff;padding:12px 22px;border-radius:24px;z-index:98;opacity:0;transition:.3s;font-size:14px;pointer-events:none;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
.row{background:var(--card);border-radius:20px;padding:16px 20px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:14px;font-size:15px}
.row small{display:block;color:var(--mut);margin-top:2px}
.row input[type=text],.row input[type=password]{flex:1;max-width:340px;height:38px;border-radius:12px;border:1px solid #8885;background:var(--sur);color:var(--txt);padding:0 12px;user-select:text}
.sw{width:50px;height:30px;border-radius:15px;background:#8886;position:relative;cursor:pointer;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--a)}.sw.on::after{left:24px}
.dots{display:flex;gap:10px}.dots i{width:30px;height:30px;border-radius:50%;cursor:pointer;border:3px solid transparent}.dots i.on{border-color:var(--txt)}
h4{margin:18px 6px 8px;font-weight:500;color:var(--a)}
.btn{border:0;border-radius:20px;height:40px;padding:0 22px;background:var(--a);color:#fff;font-size:15px;cursor:pointer}
.btn.t{background:var(--card);color:var(--txt)}
.calc{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:420px;margin:0 auto}
.calc div:first-child{grid-column:1/5;text-align:right;font-size:48px;padding:20px 8px;min-height:90px;overflow:hidden}
.calc button{height:64px;border:0;border-radius:32px;font-size:22px;background:var(--card);color:var(--txt);cursor:pointer}
.calc button.o{background:var(--a);color:#fff}
.big{font-size:min(18vw,110px);font-weight:300;text-align:center;margin:30px 0}
textarea{width:100%;height:100%;border:0;outline:0;resize:none;background:var(--card);color:var(--txt);border-radius:24px;padding:20px;font:16px/1.6 inherit;user-select:text}
.empty{text-align:center;padding:40px 10px;color:var(--mut);line-height:1.8}
.drop{border:2px dashed #8887;border-radius:28px;padding:34px;text-align:center;margin-bottom:16px;color:var(--mut)}
.drop.hot{border-color:var(--a);background:#7c5cff14}
#hg{position:absolute;top:42%;left:50%;transform:translateX(-50%);width:min(760px,92vw);max-height:30vh;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:18px 4px;justify-items:center}
.row b{font-weight:500;text-align:right;max-width:50%;word-break:break-word}
@media(max-width:600px){#dock{gap:8px;padding:10px 12px}#dock .ic{width:50px;height:50px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="dev">
 <div id="sb"><span id="t">--:--</span><span><span id="net">📶</span><span id="bat">🔋</span></span></div>
 <div id="home">
  <div id="wid"><div id="clk"></div><div id="dat"></div></div>
  <div id="hg"></div><div id="dock"></div>
  <div id="srch"><b style="color:#4285f4">G</b><span style="opacity:.6">Search apps and the web</span></div>
 </div>
 <div id="wins"></div>
 <div id="rec"></div>
 <div id="drawer"><input id="q" placeholder="Search apps"><div id="grid"></div></div>
 <div id="shade"><div id="tiles"></div><input id="bri" type="range" min="0" max="60" value="0" aria-label="Brightness"><div id="notes"></div></div>
 <div id="nav"><button id="bk" aria-label="Back">◀</button><div id="pill"></div><button id="rc" aria-label="Recents">▢</button></div>
 <div id="lock"><div id="lt"></div><div id="ld"></div><div id="lh">Swipe up or tap to unlock</div></div>
 <div id="toast"></div>
 <div id="dim"></div>
</div>
<script>
const $=s=>document.querySelector(s),E=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
const LS={g(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},s(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const cfg=Object.assign({dark:false,wall:0,accent:'#7c5cff',token:'',url:'',notes:''},LS.g('agamy',{}));
const save=()=>LS.s('agamy',cfg);
const WALLS=['linear-gradient(160deg,#1e1b4b,#7c3aed 55%,#f472b6)','linear-gradient(160deg,#052e2b,#0f766e 55%,#fde68a)','linear-gradient(160deg,#0f172a,#1d4ed8 60%,#67e8f9)','linear-gradient(160deg,#27272a,#be123c 60%,#fb923c)'];
const ACC=['#7c5cff','#0b8f6a','#1a73e8','#d93f3f'];
function apply(){document.body.classList.toggle('dark',cfg.dark);document.documentElement.style.setProperty('--a',cfg.accent);$('#dev').style.setProperty('--wall',WALLS[cfg.wall]);save()}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.k);toast.k=setTimeout(()=>t.classList.remove('on'),2800)}

/* clock, network, battery */
function tick(){const d=new Date(),h=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false});
 ['#t','#clk','#lt'].forEach(s=>$(s).textContent=h);
 const ds=d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'});$('#dat').textContent=ds;$('#ld').textContent=ds}
setInterval(tick,1000);tick();
const netUp=()=>$('#net').textContent=navigator.onLine?'📶':'✈️';addEventListener('online',netUp);addEventListener('offline',netUp);netUp();
navigator.getBattery?.().then(b=>{const u=()=>$('#bat').textContent=(b.charging?'⚡':'🔋')+Math.round(b.level*100)+'%';u();b.onlevelchange=b.onchargingchange=u});

/* storage for APKs */
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open('agamy',1);r.onupgradeneeded=()=>r.result.createObjectStore('apk',{keyPath:'id'});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const tx=async(m,f)=>{const d=await idb();return new Promise((ok,no)=>{const t=d.transaction('apk',m),q=f(t.objectStore('apk'));t.oncomplete=()=>ok(q.result);t.onerror=()=>no(t.error)})};
let installed=[];

/* app registry */
const APPS=[
 {id:'play',n:'Play Store',i:'▶️',c:'#00a173,#00d1ff',r:playApp},
 {id:'yt',n:'YouTube',i:'▶',c:'#ff0000,#c4302b',r:ytApp},
 {id:'fb',n:'Facebook',i:'<b style="font-size:36px;font-family:Arial">f</b>',c:'#1877f2,#0a5bd8',r:webApp('Facebook','https://m.facebook.com')},
 {id:'wa',n:'WhatsApp',i:'💬',c:'#25d366,#128c7e',r:webApp('WhatsApp','https://web.whatsapp.com')},
 {id:'ig',n:'Instagram',i:'📸',c:'#f58529,#c13584',r:webApp('Instagram','https://www.instagram.com')},
 {id:'tg',n:'Telegram',i:'✈️',c:'#2aabee,#229ed9',r:webApp('Telegram','https://web.telegram.org')},
 {id:'apk',n:'APK Player',i:'🤖',c:'#0b8043,#3ddc84',r:apkApp},
 {id:'browser',n:'Browser',i:'🌐',c:'#4285f4,#34a853',r:browserApp},
 {id:'camera',n:'Camera',i:'📷',c:'#ea4335,#f28b82',r:cameraApp},
 {id:'calc',n:'Calculator',i:'🧮',c:'#188038,#34a853',r:calcApp},
 {id:'clock',n:'Clock',i:'⏰',c:'#6d4aff,#b388ff',r:clockApp},
 {id:'notes',n:'Notes',i:'📝',c:'#f9ab00,#fdd663',r:notesApp},
 {id:'settings',n:'Settings',i:'⚙️',c:'#5f6368,#9aa0a6',r:settingsApp},
 {id:'perf',n:'Emulator Check',i:'📊',c:'#0b57d0,#4c8df6',r:perfApp}];
const DOCK=['play','yt','wa','browser','settings'];
function icon(a){const d=E('div','app',`<div class="ic" style="background:linear-gradient(135deg,${a.c||'#0b8043,#3ddc84'})">${a.icon?`<img src="${a.icon}" alt="">`:a.i||'🤖'}</div><span>${a.n}</span>`);
 d.onclick=()=>a.rec?runApk(a.rec,d):openWin(a.id,a.n,a,a.r,d);return d}
function renderApps(){const all=[...APPS,...installed.map(r=>({id:'x'+r.id,n:r.name,icon:r.icon,rec:r}))];
 const g=$('#grid'),f=$('#q').value.toLowerCase();g.innerHTML='';
 all.filter(a=>a.n.toLowerCase().includes(f)).forEach(a=>g.append(icon(a)));
 const hg=$('#hg');hg.innerHTML='';all.filter(a=>!DOCK.includes(a.id)).forEach(a=>hg.append(icon(a)));
 const dk=$('#dock');dk.innerHTML='';[...DOCK.map(id=>APPS.find(a=>a.id==id)),...installed.slice(0,1).map(r=>({id:'x'+r.id,n:r.name,icon:r.icon,rec:r}))].forEach(a=>dk.append(icon(a)))}
$('#q').oninput=renderApps;

/* window manager */
let wins=[],cur=null;
function closeOv(){['#drawer','#shade','#rec'].forEach(s=>$(s).classList.remove('on'))}
function show(w,from){closeOv();wins.forEach(x=>x.el.classList.remove('on'));if(from){const r=from.getBoundingClientRect();w.el.style.transformOrigin=`${r.left+r.width/2}px ${r.top+r.height/2-32}px`}w.el.classList.add('on');cur=w;$('#home').classList.add('away')}
function goHome(){closeOv();wins.forEach(x=>x.el.classList.remove('on'));cur=null;$('#home').classList.remove('away')}
function closeWin(w){w.onClose?.();w.el.remove();wins=wins.filter(x=>x!==w);if(cur===w)goHome();drawRec()}
function openWin(id,title,a,render,from){let w=wins.find(x=>x.id===id);
 if(!w){const el=E('div','win'),body=E('div','body');el.append(E('div','bar',title),body);$('#wins').append(el);w={id,title,a,el,body};wins.push(w);render(body,w);requestAnimationFrame(()=>show(w,from))}else show(w,from)}
function drawRec(){const r=$('#rec');r.innerHTML='';if(!wins.length){r.innerHTML='<div class="empty" style="width:100%;color:#fff">No recent apps</div>';return}
 wins.forEach(w=>{const c=E('div','card');const ic=icon(w.a).querySelector('.ic');ic.parentNode.remove;const b=E('b');b.append(ic.cloneNode(true),w.title);c.append(b,E('p','','Tap to open'));
  const x=E('button','','Close');x.onclick=e=>{e.stopPropagation();closeWin(w)};c.append(x);c.onclick=()=>show(w);r.append(c)})}
$('#rc').onclick=()=>{const o=$('#rec').classList.contains('on');closeOv();if(!o){drawRec();$('#rec').classList.add('on')}};
$('#pill').onclick=goHome;
$('#bk').onclick=()=>{if([...document.querySelectorAll('#drawer.on,#shade.on,#rec.on')].length)closeOv();else if(cur)goHome()};

/* gestures */
function swipe(el,fn){let y0=null;el.addEventListener('pointerdown',e=>y0=e.clientY);el.addEventListener('pointerup',e=>{if(y0!=null&&Math.abs(e.clientY-y0)>60)fn(e.clientY-y0);y0=null})}
swipe($('#home'),d=>{if(d<0){closeOv();$('#drawer').classList.add('on')}});
swipe($('#drawer'),d=>{if(d>120&&$('#drawer').scrollTop<5)$('#drawer').classList.remove('on')});
swipe($('#shade'),d=>{if(d<-60)$('#shade').classList.remove('on')});
$('#sb').onclick=()=>{const o=$('#shade').classList.contains('on');closeOv();if(!o)$('#shade').classList.add('on')};
$('#srch').onclick=()=>{$('#drawer').classList.add('on');setTimeout(()=>$('#q').focus(),380)};
function unlock(){$('#lock').classList.add('off')}
$('#lock').onclick=unlock;swipe($('#lock'),d=>d<0&&unlock());

/* quick settings */
const T=[['Internet','📶',()=>navigator.onLine],['Dark theme','🌙',()=>cfg.dark,()=>{cfg.dark=!cfg.dark;apply()}],
 ['Fullscreen','⛶',()=>!!document.fullscreenElement,()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.()],
 ['Bluetooth','🔷'],['Airplane','✈️'],['Battery saver','🔋'],['Auto-rotate','🔄'],['Location','📍']];
function drawTiles(){const t=$('#tiles');t.innerHTML='';T.forEach(x=>{const d=E('div','tile'+((x[2]?x[2]():x.on)?' on':''),`<i>${x[1]}</i>${x[0]}`);
 d.onclick=()=>{x[3]?x[3]():x.on=!x.on;setTimeout(drawTiles,120)};t.append(d)})}
drawTiles();document.addEventListener('fullscreenchange',drawTiles);
$('#bri').oninput=e=>$('#dim').style.opacity=e.target.value/100;
$('#notes').innerHTML='<div class="note"><small>Agamydroid</small>Android 16 interface is ready.</div><div class="note"><small>APK Player</small>Install an APK to add it to your launcher.</div>';

/* settings */
function settingsApp(b){
 const row=(t,s,r)=>{const d=E('div','row',`<div>${t}${s?`<small>${s}</small>`:''}</div>`);d.append(r);return d};
 const sw=E('div','sw'+(cfg.dark?' on':''));sw.onclick=()=>{cfg.dark=!cfg.dark;sw.classList.toggle('on');apply();drawTiles()};
 const wd=E('div','dots');WALLS.forEach((w,i)=>{const e=E('i',cfg.wall==i?'on':'');e.style.background=w;e.onclick=()=>{cfg.wall=i;apply();[...wd.children].forEach((c,j)=>c.classList.toggle('on',j==i))};wd.append(e)});
 const ad=E('div','dots');ACC.forEach(c=>{const e=E('i',cfg.accent==c?'on':'');e.style.background=c;e.onclick=()=>{cfg.accent=c;apply();[...ad.children].forEach(x=>x.classList.toggle('on',x===e))};ad.append(e)});
 const inp=(k,type,ph)=>{const i=E('input');i.type=type;i.placeholder=ph;i.value=cfg[k];i.oninput=()=>{cfg[k]=i.value.trim();save()};return i};
 b.append(E('h4','','Display'),row('Dark theme','',sw),row('Wallpaper','',wd),row('Accent color','',ad),
  E('h4','','APK emulator'),
  row('Appetize API token','Runs APKs in the cloud (free tier available)',inp('token','password','Token')),
  row('Custom emulator URL','Overrides Appetize. Any web stream: ws-scrcpy, noVNC, Redroid',inp('url','text','https://your-server:8000')),
  E('h4','','About'),row('Android version','Interface style','16 (API 36)'),row('System','','Agamydroid'))}

/* browser */
function browserApp(b){const i=E('input');i.style.cssText='width:100%;height:46px;border-radius:23px;border:0;padding:0 20px;background:var(--card);color:var(--txt);margin-bottom:12px;font-size:15px;user-select:text';i.placeholder='Type a web address';
 const box=E('div');box.style.cssText='position:relative;height:calc(100% - 60px);border-radius:24px;overflow:hidden';const f=E('iframe');f.src='https://en.wikipedia.org/wiki/Android_(operating_system)';box.append(f);
 i.onkeydown=e=>{if(e.key!='Enter')return;let v=i.value.trim();f.src=/^https?:\/\//.test(v)?v:/^[\w-]+(\.[\w-]+)+/.test(v)?'https://'+v:'https://en.wikipedia.org/w/index.php?search='+encodeURIComponent(v)};
 b.append(i,box);b.append(E('p','empty','Some sites refuse to load inside a frame.'))}

/* camera */
function cameraApp(b,w){const v=E('video');v.autoplay=v.playsInline=v.muted=true;v.style.cssText='width:100%;height:100%;object-fit:cover;border-radius:24px;background:#000';b.append(v);
 navigator.mediaDevices?.getUserMedia({video:true}).then(s=>{v.srcObject=s;w.onClose=()=>s.getTracks().forEach(t=>t.stop())}).catch(()=>{b.innerHTML='<div class="empty">Allow camera access in Chrome to use this app.</div>'})}

/* calculator */
function calcApp(b){const c=E('div','calc'),o=E('div','','0');c.append(o);let s='';
 '7 8 9 ÷ 4 5 6 × 1 2 3 − C 0 . +'.split(' ').forEach(k=>{const x=E('button',/[÷×−+]/.test(k)?'o':'',k);x.onclick=()=>{if(k=='C')s='';else s+=k;o.textContent=s||'0'};c.append(x)});
 const eq=E('button','o','=');eq.style.gridColumn='1/5';eq.onclick=()=>{try{const r=Function('return '+s.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-').replace(/[^0-9+\-*/.]/g,''))();s=String(+(+r).toFixed(8));o.textContent=s}catch{o.textContent='Error';s=''}};c.append(eq);b.append(c)}

/* clock */
function clockApp(b,w){const t=E('div','big'),sw=E('div','big');sw.style.fontSize='48px';sw.textContent='00:00.0';let r=null,t0=0,acc=0;
 const u=()=>{t.textContent=new Date().toLocaleTimeString([],{hour12:false})};u();const iv=setInterval(()=>{u();if(r){const d=acc+Date.now()-t0;sw.textContent=String(Math.floor(d/60000)).padStart(2,0)+':'+String(Math.floor(d/1000)%60).padStart(2,0)+'.'+Math.floor(d/100)%10}},100);
 const go=E('button','btn','Start'),rs=E('button','btn t','Reset');go.onclick=()=>{if(r){acc+=Date.now()-t0;r=null;go.textContent='Start'}else{t0=Date.now();r=1;go.textContent='Stop'}};rs.onclick=()=>{r=null;acc=0;go.textContent='Start';sw.textContent='00:00.0'};
 const bx=E('div');bx.style.cssText='display:flex;gap:12px;justify-content:center';bx.append(go,rs);b.append(t,sw,bx);w.onClose=()=>clearInterval(iv)}

/* notes */
function notesApp(b){const t=E('textarea');t.placeholder='Write something';t.value=cfg.notes;t.oninput=()=>{cfg.notes=t.value;save()};b.append(t)}

/* web apps, YouTube, Play Store, emulator check */
function openWeb(u){if(!window.open(u,'agamy-web','popup,width=430,height=780'))toast('Allow pop-ups for this site in Chrome')}
function webApp(n,u){return b=>{const d=E('div','empty',`<h2 style="color:var(--txt);font-weight:500">${n}</h2><p>${n} cannot be shown inside another page, so it opens in its own window.</p>`);const o=E('button','btn','Open '+n);o.onclick=()=>openWeb(u);d.append(o,E('p','','For the real Android app, install its APK in APK Player.'));b.append(d)}}
function ytApp(b){
 const i=E('input');i.placeholder='Paste a YouTube link';i.style.cssText='width:100%;height:46px;border-radius:23px;border:0;padding:0 20px;background:var(--card);color:var(--txt);margin-bottom:12px;font-size:15px;user-select:text';
 const box=E('div','',`<div class="empty" style="color:#fff;padding-top:30%">Paste a link and press Enter to play it here.</div>`);box.style.cssText='position:relative;height:calc(100% - 120px);border-radius:24px;overflow:hidden;background:#111';
 i.onkeydown=e=>{if(e.key!='Enter')return;const v=i.value.trim(),m=v.match(/(?:v=|youtu\.be\/|shorts\/|embed\/)([\w-]{11})/)||v.match(/^([\w-]{11})$/);if(!m)return toast('Paste a valid YouTube link');box.innerHTML='';const f=E('iframe');f.allow='autoplay;fullscreen;encrypted-media;picture-in-picture';f.src='https://www.youtube-nocookie.com/embed/'+m[1]+'?autoplay=1';box.append(f)};
 const o=E('button','btn t','Open youtube.com');o.style.marginTop='12px';o.onclick=()=>openWeb('https://m.youtube.com');b.append(i,box,o)}
function playApp(b){const o=E('div','row','<div>Google Play on the web<small>Opens in its own window. Apps there install on a real device, not in this emulator.</small></div>');const g=E('button','btn t','Open');g.onclick=()=>openWeb('https://play.google.com/store');o.append(g);b.append(o,E('h4','','Install from file'));apkApp(b)}
async function perfApp(b){
 const R=(t,v,s)=>b.append(E('div','row',`<div>${t}${s?`<small>${s}</small>`:''}</div><b>${v}</b>`));
 b.append(E('h4','','This device'));
 let gpu='Unavailable';try{const g=E('canvas').getContext('webgl'),x=g.getExtension('WEBGL_debug_renderer_info');gpu=x?g.getParameter(x.UNMASKED_RENDERER_WEBGL):'WebGL available'}catch{}
 R('Graphics',gpu,'Only decodes the video stream. The game runs on the emulator.');
 R('CPU cores / memory',(navigator.hardwareConcurrency||'?')+' / '+(navigator.deviceMemory?navigator.deviceMemory+' GB':'?'));
 const fps=await new Promise(ok=>{let n=0,t0=performance.now();(function f(){n++;performance.now()-t0<1000?requestAnimationFrame(f):ok(n)})()});
 R('Display frame rate',fps+' fps');
 const host=cfg.url||'https://appetize.io',t0=performance.now();let ms='Unreachable';
 try{await fetch(host,{mode:'no-cors',cache:'no-store'});ms=Math.round(performance.now()-t0)+' ms'}catch{}
 R('Round trip to emulator',ms,host.replace(/^https?:\/\//,''));
 b.append(E('h4','','Installed APKs'));
 if(!installed.length)R('No APKs installed','');
 installed.forEach(r=>{const a=r.abis||[];R(r.name,a.join(', ')||'No native code',!a.length?'Pure Java/Kotlin: runs on any emulator':a.some(x=>/x86/.test(x))?'Has an x86 build: suits cloud emulators':'ARM only: may fail or run slowly on x86 emulators')});
 b.append(E('div','empty','Heavy 3D games need an emulator server with a real GPU. A browser page cannot measure that, so test each game and watch the latency here.'))}

/* APK installer */
function pkgFrom(buf){let s='';for(const x of new Uint8Array(buf))s+=x>31&&x<127?String.fromCharCode(x):(x?' ':'');
 return (s.match(/[a-z][a-z0-9_]*(?:\.[a-z0-9_]+)+/gi)||[]).find(m=>!/^(schemas|android|http|www)/i.test(m))||''}
async function install(file){
 if(!/\.(apk|xapk|apks)$/i.test(file.name))return toast('Choose an APK file');
 toast('Reading '+file.name);
 try{const z=await JSZip.loadAsync(file),m=z.file('AndroidManifest.xml');
  if(!m)return toast('Bundles (XAPK/APKS) are not supported. Use one universal APK.');const pkg=pkgFrom(await m.async('arraybuffer'));
  const abis=[...new Set(Object.keys(z.files).map(n=>(n.match(/^lib\/([^/]+)\//)||[])[1]).filter(Boolean))];
  const names=Object.keys(z.files).filter(n=>/^res\/.*\.(png|webp)$/i.test(n)&&/(launcher|icon)/i.test(n)).slice(0,14);
  let best=null;for(const n of names){const bl=await z.file(n).async('blob');if(!best||bl.size>best.size)best=bl}
  const ic=best?await new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result);r.readAsDataURL(best)}):'';
  const rec={id:Date.now()+'',name:file.name.replace(/\.(apk|xapk|apks)$/i,''),pkg,abis,icon:ic,blob:file};
  await tx('readwrite',s=>s.put(rec));installed.push(rec);renderApps();drawApk();toast('Installed '+rec.name)
 }catch(e){toast('This file is not a valid APK')}}
let drawApk=()=>{};
function apkApp(b){
 const drop=E('div','drop','Drop an APK here or choose one');const pick=E('button','btn','Choose APK');pick.style.marginTop='14px';
 const inp=E('input');inp.type='file';inp.accept='.apk';inp.hidden=true;inp.onchange=()=>inp.files[0]&&install(inp.files[0]);pick.onclick=()=>inp.click();drop.append(E('br'),pick,inp);
 ['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('hot')}));
 ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('hot')}));
 drop.addEventListener('drop',e=>e.dataTransfer.files[0]&&install(e.dataTransfer.files[0]));
 const list=E('div');b.append(drop,list);
 drawApk=()=>{list.innerHTML='';if(!installed.length){list.innerHTML='<div class="empty">No apps installed yet.<br>Installed APKs appear on your home screen automatically.</div>';return}
  installed.forEach(r=>{const row=E('div','row',`<div>${r.name}<small>${r.pkg||'Package unknown'} · ${(r.blob.size/1048576).toFixed(1)} MB · ${(r.abis||[]).join('/')||'no native code'}</small></div>`);
   const run=E('button','btn','Run'),del=E('button','btn t','Remove');run.onclick=()=>runApk(r);
   del.onclick=async()=>{await tx('readwrite',s=>s.delete(r.id));installed=installed.filter(x=>x!==r);renderApps();drawApk()};
   const g=E('div');g.style.cssText='display:flex;gap:8px';g.append(run,del);row.append(g);list.append(row)})};
 drawApk()}

/* run APK: cloud emulator (Appetize) or your own streamed emulator */
function runApk(r,from){
 openWin('run'+r.id,r.name,{n:r.name,icon:r.icon,c:'#0b8043,#3ddc84'},async(b)=>{
  const frame=u=>{b.innerHTML='';const f=E('iframe');f.allow='fullscreen;camera;microphone;clipboard-write';f.src=u;b.append(f)};
  if(cfg.url)return frame(cfg.url);
  if(!cfg.token){b.innerHTML='<div class="empty">To run this APK, open Settings and add either:<br>• an Appetize API token (cloud Android emulator), or<br>• the URL of your own emulator stream.</div>';return}
  try{if(!r.key){b.innerHTML='<div class="empty">Uploading to the emulator…</div>';const fd=new FormData();fd.append('file',r.blob,'app.apk');fd.append('platform','android');
    const res=await fetch('https://api.appetize.io/v1/apps',{method:'POST',headers:{Authorization:'Basic '+btoa(cfg.token+':')},body:fd});
    const j=await res.json();if(!j.publicKey)throw new Error(j.message||'Upload failed');r.key=j.publicKey;await tx('readwrite',s=>s.put(r))}
   frame(`https://appetize.io/embed/${r.key}?device=pixel7&autoplay=true&scale=auto&orientation=portrait`)
  }catch(e){b.innerHTML='<div class="empty">Could not start the emulator.<br>'+String(e.message||e)+'<br>Check your token in Settings.</div>'}
 },from)}

/* boot */
apply();renderApps();
tx('readonly',s=>s.getAll()).then(a=>{installed=a||[];renderApps();drawApk()}).catch(()=>{});
</script>
